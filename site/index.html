<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --grid:#1f232c; --fg:#e6e8ec; --muted:#8b93a1; --snake:#4ade80; --head:#bbf7d0; --food:#f87171; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; touch-action:none; }
  h1 { margin:0; font-size:1.5rem; letter-spacing:.05em; }
  .bar { display:flex; gap:24px; color:var(--muted); }
  .bar b { color:var(--fg); }
  .wrap { position:relative; }
  canvas { display:block; background:var(--grid); border-radius:8px; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; background:rgba(15,17,21,.75); border-radius:8px; padding:16px; }
  #msg[hidden] { display:none; }
  .hint { color:var(--muted); font-size:.85rem; text-align:center; }
</style>
</head>
<body>
<h1>SNAKE</h1>
<div class="bar"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
<div class="wrap">
  <canvas id="c"></canvas>
  <div id="msg">Press Space or tap to start</div>
</div>
<p class="hint">Arrow keys or WASD to move. Space to pause. Swipe on touch screens.</p>
<script>
(() => {
  'use strict';
  const N = 20, CELLS = N * N;
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0]; // up, right, down, left
  const KEYS = { ArrowUp:0, w:0, W:0, ArrowRight:1, d:1, D:1, ArrowDown:2, s:2, S:2, ArrowLeft:3, a:3, A:3 };

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const msg = document.getElementById('msg'), scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  const css = getComputedStyle(document.documentElement);
  const C = {}; for (const k of ['grid', 'snake', 'head', 'food']) C[k] = css.getPropertyValue('--' + k).trim();

  // Snake body as a ring buffer of cell indices plus an occupancy grid: O(1) move and collision checks.
  const body = new Int16Array(CELLS), occ = new Uint8Array(CELLS);
  let headI, tailI, len, dir, food, score, interval, state = 'ready', acc = 0, last = 0, size = 0;
  const queue = [];
  let best = 0;
  try { best = +localStorage.getItem('snakeBest') || 0; } catch (e) {}
  bestEl.textContent = best;

  function paint(i, color) {
    ctx.fillStyle = color;
    ctx.fillRect((i % N) * size + 1, ((i / N) | 0) * size + 1, size - 2, size - 2);
  }

  function placeFood() {
    // Pick the r-th free cell: always terminates, no random retry loop.
    let r = (Math.random() * (CELLS - len)) | 0;
    for (let i = 0; i < CELLS; i++) if (!occ[i] && r-- === 0) { food = i; paint(i, C.food); return; }
  }

  function drawAll() {
    ctx.fillStyle = C.grid;
    ctx.fillRect(0, 0, N * size, N * size);
    for (let k = 0, i = tailI; k < len; k++, i = (i + 1) % CELLS) paint(body[i], body[i] === body[headI] ? C.head : C.snake);
    if (food >= 0) paint(food, C.food);
  }

  function reset() {
    occ.fill(0);
    const mid = (N >> 1) * N + (N >> 1);
    len = 3; tailI = 0; headI = 2; dir = 1;
    for (let k = 0; k < 3; k++) { body[k] = mid - 2 + k; occ[mid - 2 + k] = 1; }
    queue.length = 0; score = 0; interval = 140; acc = 0; food = -1;
    scoreEl.textContent = 0;
    drawAll();
    placeFood();
  }

  function end(text) {
    state = 'over';
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('snakeBest', best); } catch (e) {} }
    msg.textContent = text + ' Score ' + score + '. Press Space or tap to play again.';
    msg.hidden = false;
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const h = body[headI], x = h % N + DX[dir], y = ((h / N) | 0) + DY[dir];
    if (x < 0 || y < 0 || x >= N || y >= N) return end('Hit the wall.');
    const n = y * N + x, grow = n === food;
    if (!grow) { const t = body[tailI]; occ[t] = 0; paint(t, C.grid); tailI = (tailI + 1) % CELLS; len--; }
    if (occ[n]) return end('Ran into yourself.');
    paint(h, C.snake);
    headI = (headI + 1) % CELLS; body[headI] = n; occ[n] = 1; len++;
    paint(n, C.head);
    if (grow) {
      scoreEl.textContent = ++score;
      interval = Math.max(60, interval - 3);
      if (len === CELLS) return end('You win!');
      placeFood();
    }
  }

  function loop(t) {
    if (state !== 'run') return;
    acc += t - last; last = t;
    while (acc >= interval && state === 'run') { acc -= interval; step(); }
    requestAnimationFrame(loop);
  }

  function toggle() {
    if (state === 'run') { state = 'pause'; msg.textContent = 'Paused. Press Space or tap to resume.'; msg.hidden = false; return; }
    if (state === 'over' || state === 'ready') reset();
    state = 'run'; msg.hidden = true;
    last = performance.now();
    requestAnimationFrame(loop);
  }

  function turn(d) {
    const prev = queue.length ? queue[queue.length - 1] : dir;
    if (d !== prev && d !== (prev + 2) % 4 && queue.length < 2) queue.push(d);
  }

  function resize() {
    size = Math.max(10, Math.floor(Math.min(innerWidth - 32, innerHeight - 200, 520) / N));
    const px = size * N, dpr = devicePixelRatio || 1;
    cv.style.width = cv.style.height = px + 'px';
    cv.width = cv.height = px * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawAll();
  }

  addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); toggle(); return; }
    const d = KEYS[e.key];
    if (d !== undefined) { e.preventDefault(); if (state === 'run') turn(d); }
  });

  let tx = 0, ty = 0;
  addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) { if (state !== 'run') toggle(); return; }
    if (state === 'run') turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  }, { passive: true });
  msg.addEventListener('click', () => { if (state !== 'run') toggle(); });
  addEventListener('resize', resize);

  reset();
  resize();
})();
</script>
</body>
</html>
